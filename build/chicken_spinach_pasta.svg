<svg xmlns="http://www.w3.org/2000/svg" width="1794" height="1194" viewBox="0 0 1794 1194" role="img" aria-labelledby="svg-title"><title id="svg-title">Chicken Spinach Pasta</title><rect id="page-background" x="0" y="0" width="1794" height="1194" fill="#fffde8" /><text class="card-title" x="40" y="76.8" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="56" font-weight="bold" text-anchor="start">Chicken Spinach Pasta</text><text class="card-subtitle" x="40" y="120.4" fill="#4a4a4a" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start">serves 4 • prep 5 min • cook 25 min • total 30 min</text><text class="card-source" x="40" y="150.4" fill="#4a4a4a" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Source: Healthy Fitness Meals</text><g id="cell-backgrounds"><rect id="cell-pasta" x="40" y="177" width="500" height="96" fill="#ffffff" /><rect id="cell-chicken" x="40" y="273" width="500" height="72" fill="#ffffff" /><rect id="cell-salt_pepper" x="40" y="345" width="500" height="72" fill="#ffffff" /><rect id="cell-italian_seasoning" x="40" y="417" width="500" height="72" fill="#ffffff" /><rect id="cell-olive_oil" x="40" y="489" width="500" height="72" fill="#ffffff" /><rect id="cell-garlic" x="40" y="561" width="500" height="72" fill="#ffffff" /><rect id="cell-sun_dried_tomatoes" x="40" y="633" width="500" height="72" fill="#ffffff" /><rect id="cell-flour" x="40" y="705" width="500" height="72" fill="#ffffff" /><rect id="cell-milk" x="40" y="777" width="500" height="72" fill="#ffffff" /><rect id="cell-parmesan" x="40" y="849" width="500" height="72" fill="#ffffff" /><rect id="cell-spinach" x="40" y="921" width="500" height="72" fill="#ffffff" /><rect id="cell-garnish" x="40" y="993" width="500" height="96" fill="#ffffff" /><rect id="cell-pasta_cooked" x="540" y="177" width="280" height="96" fill="#ffffff" /><rect id="cell-seasoned_chicken" x="540" y="273" 