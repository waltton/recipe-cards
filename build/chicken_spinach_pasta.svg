40" y1="177" x2="40" y2="1089" /><line x1="540" y1="177" x2="540" y2="1089" /><line x1="820" y1="177" x2="820" y2="921" /><line x1="820" y1="993" x2="820" y2="1089" /><line x1="1092" y1="177" x2="1092" y2="993" /><line x1="1366" y1="177" x2="1366" y2="993" /><line x1="1614" y1="177" x2="1614" y2="1089" /><line x1="1754" y1="177" x2="1754" y2="1089" /></g><g id="cell-text"><text class="ingredient-text" x="290" y="234" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">12 oz (340 g) pasta</text><text class="ingredient-text" x="290" y="318" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">1 lb (454 g) chicken breast</text><text class="ingredient-text" x="290" y="390" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">salt + pepper to taste</text><text class="ingredient-text" x="290" y="462" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">1 tsp Italian seasoning</text><text class="ingredient-text" x="290" y="534" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">2 tbsp (30 mL) olive oil</text><text class="ingredient-text" x="290" y="606" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">2–3 garlic cloves, minced</text><text class="ingredient-text" x="290" y="678" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">1.5 oz (43 g) sun-dried tomatoes</text><text class="ingredient-text" x="290" y="750" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">2 tbsp flour</text><text class="ingredient-text" x="290" y="822" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">2 cups (475 mL) milk</text><text class="ingredient-text" x="290" y="894" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">1 cup grated Parmesan</text><text class="ingredient-text" x="290" y="966" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">2 cups fresh spinach</text><text class="ingredient-text" x="290" y="1050" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">2 tbsp parsley + black pepper</text><text class="process-text" x="680" y="217.2" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">cook until</text><text class="process-text" x="680" y="250.8" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">al dente</text><text class="process-text" x="680" y="373.2" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">season</text><text class="process-text" x="680" y="406.8" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">both sides</text><text class="process-text" x="680" y="642" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">prepare aromatics</text><text class="process-text" x="680" y="805.2" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">whisk until</text><text class="process-text" x="680" y="838.8" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">smooth</text><text class="process-text" x="680" y="1033.2" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">chop parsley;</text><text class="process-text" x="680" y="1066.8" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">grind pepper</text><text class="process-text" x="956" y="234" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">drain; set aside</text><text class="process-text" x="956" y="375.6" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">cook in skillet</text><text class="process-text" x="956" y="409.2" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">6–8 min per side</text><text class="process-text" x="956" y="442.8" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle"> </text><text class="process-text" x="956" y="476.4" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">165°F / 74°C</text><text class="process-text" x="956" y="625.2" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">sauté in same pan</text><text class="process-text" x="956" y="658.8" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">1–2 min</text><text class="process-text" x="1229" y="409.2" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">rest briefly;</text><text class="process-text" x="1229" y="442.8" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">slice thinly</text><text class="process-text" x="1229" y="718.8" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">add milk mixture</text><text class="process-text" x="1229" y="752.4" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">+ spinach</text><text class="process-text" x="1229" y="786" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle"> </text><text class="process-text" x="1229" y="819.6" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">bubble until thick;</text><text class="process-text" x="1229" y="853.2" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">wilt spinach</text><text class="process-text" x="1490" y="526.8" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">stir together</text><text class="process-text" x="1490" y="560.4" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle"> </text><text class="process-text" x="1490" y="594" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">pasta</text><text class="process-text" x="1490" y="627.6" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">+ sauce</text><text class="process-text" x="1490" y="661.2" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">+ sliced chicken</text><text class="process-text" x="1684" y="608.4" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">top</text><text class="process-text" x="1684" y="642" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">and</text><text class="process-text" x="1684" y="675.6" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">serve</text></g><text class="footer-note" x="40" y="1123.4" fill="#4a4a4a" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">• Cook pasta according to its package directions.</text><text class="footer-note" x="40" y="1151.4" fill="#4a4a4a" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">• Chicken is done at 165°F / 74°C.</text></svg>
