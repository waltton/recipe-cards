version: 1

card:
  title: Hatch Chile Infused Chocolate Truffles
  subtitle: yields about 32 to 36 truffles

theme:
  border_color: "#4b9847"
  border_width: 6
  cell_background: "#ffffff"
  background: "#fffde8"
  text_color: "#111111"

layout:
  row_height: 72

ingredients:
  chocolate: 500 g dark chocolate
  cream: 1 cup (235 mL) heavy whipping cream
  chiles: 5 mild Hatch chiles, cooked
  cocoa: cocoa powder

actions:
  melted_chocolate:
    from: chocolate
    do: |-
      melt in double
      boiler
    align: left

  scalded_cream:
    from: cream
    do: scald
    align: left

  chile_cream:
    from: [scalded_cream, chiles]
    do: |-
      puree
      and
      strain

  ganache:
    from: [melted_chocolate, chile_cream]
    do: |-
      stir into
      chocolate
    align: left

  chilled:
    from: ganache
    do: chill
    align: left

  formed:
    from: chilled
    do: |-
      form
      into
      balls
    align: left

  dust:
    from: [formed, cocoa]
    do: dust
    align: left

final: dust
