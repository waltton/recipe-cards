<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1574" height="519" viewBox="0 0 1574 519" role="img" aria-labelledby="svg-title"><title id="svg-title">Hatch Chile Infused Chocolate Truffles</title><rect id="page-background" x="0" y="0" width="1574" height="519" fill="#fffde8" /><text class="card-title" x="40" y="76.8" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="56" font-weight="bold" text-anchor="start">Hatch Chile Infused Chocolate Truffles</text><text class="card-subtitle" x="40" y="120.4" fill="#4a4a4a" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start">yields about 32 to 36 truffles</text><g id="cell-backgrounds"><rect id="cell-chocolate" x="40" y="177" width="542" height="96" fill="#ffffff" /><rect id="cell-cream" x="40" y="273" width="542" height="72" fill="#ffffff" /><rect id="cell-chiles" x="40" y="345" width="542" height="72" fill="#ffffff" /><rect id="cell-cocoa" x="40" y="417" width="542" height="72" fill="#ffffff" /><rect id="cell-melted_chocolate" x="582" y="177" width="224" height="96" fill="#ffffff" /><rect id="cell-scalded_cream" x="582" y="273" width="224" height="72" fill="#ffffff" /><rect id="cell-flow_wait_3" x="582" y="345" width="224" height="72" fill="#ffffff" /><rect id="cell-flow_wait_1" x="582" y="417" width="812" height="72" fill="#ffffff" /><rect id="cell-flow_wait_2" x="806" y="177" width="140" height="96" fill="#ffffff" /><rect id="cell-chile_cream" x="806" y="273" width="140" height="144" fill="#ffffff" /><rect id="cell-ganache" x="946" y="177" width="168" height="240" fill="#ffffff" /><rect id="cell-chilled" x="1114" y="177" width="140" height="240" fill="#ffffff" /><rect id="cell-formed" x="1254" y="177" width="140" height="240" fill="#ffffff" /><rect id="cell-dust" x="1394" y="177" width="140" height="312" fill="#ffffff" /></g><g id="cell-borders" fill="none" stroke="#4b9847" stroke-width="6" stroke-linecap="butt"><line x1="40" y1="177" x2="1534" y2="177" /><line x1="40" y1="273" x2="946" y2="273" /><line x1="40" y1="345" x2="806" y2="345" /><line x1="40" y1="417" x2="1394" y2="417" /><line x1="40" y1="489" x2="1534" y2="489" /><line x1="40" y1="177" x2="40" y2="489" /><line x1="582" y1="177" x2="582" y2="489" /><line x1="806" y1="177" x2="806" y2="417" /><line x1="946" y1="177" x2="946" y2="417" /><line x1="1114" y1="177" x2="1114" y2="417" /><line x1="1254" y1="177" x2="1254" y2="417" /><line x1="1394" y1="177" x2="1394" y2="489" /><line x1="1534" y1="177" x2="1534" y2="489" /></g><g id="cell-text"><text class="ingredient-text" x="311" y="234" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">500 g dark chocolate</text><text class="ingredient-text" x="311" y="318" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">1 cup (235 mL) heavy whipping cream</text><text class="ingredient-text" x="311" y="390" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">5 mild Hatch chiles, cooked</text><text class="ingredient-text" x="311" y="462" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">cocoa powder</text><text class="process-text" x="598" y="217.2" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="start">melt in double</text><text class="process-text" x="598" y="250.8" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="start">boiler</text><text class="process-text" x="598" y="318" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="start">scald</text><text class="process-text" x="876" y="320.4" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">puree</text><text class="process-text" x="876" y="354" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">and</text><text class="process-text" x="876" y="387.6" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle">strain</text><text class="process-text" x="962" y="289.2" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="start">stir into</text><text class="process-text" x="962" y="322.8" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="start">chocolate</text><text class="process-text" x="1130" y="306" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="start">chill</text><text class="process-text" x="1270" y="272.4" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="start">form</text><text class="process-text" x="1270" y="306" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="start">into</text><text class="process-text" x="1270" y="339.6" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="start">balls</text><text class="process-text" x="1410" y="342" fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="start">dust</text></g></svg>
